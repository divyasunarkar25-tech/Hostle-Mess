<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Admin Login</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/auth.css">
</head>

<body>
    <div class="auth-container">
        <div class="card auth-card" style="border-top:5px solid var(--secondary-color)">
            <h2 class="auth-title">Admin Portal</h2>
            <p class="auth-subtitle">Secure restricted access</p>
            <div id="alertBox"></div>
            <form id="adminLoginForm">
                <div class="form-group">
                    <input type="email" id="email" class="form-control" placeholder="Admin Email" required>
                </div>
                <div class="form-group">
                    <input type="password" id="password" class="form-control" placeholder="Password" required>
                </div>
                <button type="submit" class="btn btn-secondary" style="width:100%">Access Dashboard</button>
            </form>
            <div class="auth-links">
                <a href="register.html" style="color:var(--text-secondary)">Register New Admin</a>
                <br><br>
                <a href="../login.html" style="color:var(--primary-color)">Return to Student Login</a>
            </div>
        </div>
    </div>
    <script src="../js/common.js"></script>
    <script src="js/admin-auth.js"></script>
</body>

</html>
