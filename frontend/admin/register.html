<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Admin Register</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/auth.css">
</head>

<body>
    <div class="auth-container">
        <div class="card auth-card" style="border-top:5px solid var(--secondary-color)">
            <h2 class="auth-title">Register Admin</h2>
            <p class="auth-subtitle">Initialize a new administration access</p>
            <div id="alertBox"></div>
            <form id="adminRegisterForm">
                <div class="form-group">
                    <input type="text" id="name" class="form-control" placeholder="Admin Full Name" required>
                </div>
                <div class="form-group">
                    <input type="email" id="email" class="form-control" placeholder="Admin Email" required>
                </div>
                <div class="form-group">
                    <input type="password" id="password" class="form-control" placeholder="Password" required
                        minlength="6">
                </div>
                <div class="form-group">
                    <input type="password" id="confirmPassword" class="form-control" placeholder="Confirm Password"
                        required minlength="6">
                </div>
                <button type="submit" class="btn btn-secondary" style="width:100%">Create Admin Identity</button>
            </form>
            <div class="auth-links">
                <a href="login.html" style="color:var(--text-secondary)">Back to Login</a>
            </div>
        </div>
    </div>
    <script src="../js/common.js"></script>
    <script src="js/admin-auth.js"></script>
</body>

</html>
