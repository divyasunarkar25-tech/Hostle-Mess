<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>User Feedback</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
</head>

<body>
    <nav class="navbar">
        <div class="logo">Mess Manager</div>
        <div class="nav-links" id="userLinks">
            <a href="index.html">Home</a>
            <a href="feedback.html" class="active">Feedback</a>
            <a href="nutrition.html">Nutrition</a>
            <span id="navUserName"></span>
            <button class="btn btn-secondary logout-btn">Logout</button>
        </div>
    </nav>

    <div class="container">
        <h2 class="section-title">Submit Feedback</h2>
        <div id="alertBox"></div>
        <div style="max-width:600px; margin:0 auto 3rem auto;">
            <div class="card">
                <form id="feedbackForm">
                    <div class="form-group">
                        <label>Overall Rating (1-5)</label>
                        <input type="number" id="rating" min="1" max="5" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label>Food Quality (1-5)</label>
                        <input type="number" id="quality" min="1" max="5" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label>Food Quantity (1-5)</label>
                        <input type="number" id="quantity" min="1" max="5" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label>Comment</label>
                        <textarea id="comment" class="form-control" rows="4"></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary">Submit Feedback</button>
                </form>
            </div>
        </div>

        <h2 class="section-title">My Previous Feedback</h2>
        <div class="table-container">
            <table class="data-table">
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Rating</th>
                        <th>Quality</th>
                        <th>Quantity</th>
                        <th>Comment</th>
                    </tr>
                </thead>
                <tbody id="myFeedbackTable">
                    <tr>
                        <td colspan="5">Loading...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script src="js/common.js"></script>
    <script src="js/feedback.js"></script>
</body>

</html>
